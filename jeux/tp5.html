<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon coach TP5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='22' rx='5' fill='%231F2A44'/%3E%3Crect x='7' y='12' width='8' height='4' rx='2' fill='%232F6CC4'/%3E%3Crect x='13' y='18' width='12' height='4' rx='2' fill='%23C43E57'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/konvink.js"></script>
<script>
/* Même thème que le site (choisi sur l'accueil, mémorisé sur l'appareil) */
(function(){
  var r = document.documentElement;
  try{ var k = localStorage.getItem("mp-theme"); if (k) r.dataset.skin = k; }catch(e){}
  try{ var p = JSON.parse(localStorage.getItem("mp-prefs") || "{}") || {};
       ["big","plain","still"].forEach(function(x){ if (p[x]) r.setAttribute("data-"+x, ""); }); }catch(e){}
})();
</script>
<style>
:root{ --c:#2F6CC4; --on-c:#fff; --ok:#2E8558; }
body{padding-bottom:48px}
.wrap.narrow{max-width:680px}
[hidden]{display:none !important}
.btn.solid:hover{background:var(--ink); color:var(--sheet); opacity:.88}

/* Barre du haut */
.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:14px; min-height:44px}
.bar a,.bar button.link{font:inherit; font-weight:700; text-decoration:none; color:var(--ink-soft); font-size:15px; background:none; border:0; padding:0; cursor:pointer}
.bar a:hover,.bar button.link:hover{color:var(--ink)}
.save-state{font-size:12.5px; color:var(--ink-soft)}

/* Étiquettes de source */
.tag-off,.tag-no{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:1px 7px; vertical-align:2px; margin-left:4px; white-space:nowrap}
.tag-off{background:var(--ink); color:var(--sheet)}
.tag-no{border:1.5px dashed var(--ink-soft); color:var(--ink-soft)}

/* Accueil du coach */
.intro h1{font-family:var(--head); font-weight:800; font-size:clamp(30px,8vw,44px); line-height:1.02; letter-spacing:-.02em; margin:18px 0 8px}
.intro p{margin:0 0 18px; font-size:18px; color:var(--ink-soft)}
.intro p b{color:var(--ink)}

.path{list-style:none; padding:0; margin:0 0 22px; position:relative}
.path li{position:relative; padding-left:62px; margin:0 0 12px}
.path li::before{content:""; position:absolute; left:23px; top:46px; bottom:-14px; width:3px; background:var(--line); border-radius:2px}
.path li:last-child::before{display:none}
.path li.done::before{background:var(--ok)}
.path .dot{position:absolute; left:0; top:8px; width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--head); font-weight:800; font-size:22px; background:var(--sheet); border:3px solid var(--line); color:var(--ink-soft); z-index:1}
.path li.now .dot{border-color:var(--ink); color:var(--ink)}
.path li.done .dot{background:var(--ok); border-color:var(--ok); color:#fff}
.stage{display:block; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--sheet); border:2px solid var(--line);
  border-radius:var(--radius-sm); padding:14px 16px; cursor:pointer; text-decoration:none}
.stage:hover{border-color:var(--ink)}
.path li.now .stage{border:3px solid var(--ink); box-shadow:5px 5px 0 var(--bubble)}
.stage .st{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft)}
.path li.now .stage .st{color:var(--bubble)}
.path li.done .stage .st{color:var(--ok)}
.stage b{display:block; font-family:var(--head); font-weight:800; font-size:21px; line-height:1.15; margin:2px 0 3px}
.stage small{display:block; font-size:15px; color:var(--ink-soft); line-height:1.35}
.stage .co-pill{display:inline-block; font-family:var(--head); font-weight:800; font-size:14px; background:var(--c); color:var(--on-c); border-radius:6px; padding:0 7px; margin-right:6px}

.result{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--sheet); border:2px dashed var(--line); border-radius:var(--radius-sm); padding:12px 16px; margin:0 0 22px}
.result b{font-family:var(--head); font-size:17px}
.result small{display:block; color:var(--ink-soft); font-size:14px}

.links h2{font-family:var(--head); font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 8px}
.links ul{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.links a{display:flex; justify-content:space-between; gap:10px; text-decoration:none; font-weight:700; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px}
.links a:hover{border-color:var(--ink)}
.links a span{font-weight:400; color:var(--ink-soft); font-size:14px}

/* Écrans d'étape */
.head{margin:10px 0 14px}
.head .k{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft)}
.head h1{font-family:var(--head); font-weight:800; font-size:clamp(26px,7vw,34px); line-height:1.08; margin:2px 0 0; letter-spacing:-.01em}
.prog{display:flex; gap:5px; margin:10px 0 0}
.prog i{flex:1; height:6px; border-radius:3px; background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.done{background:var(--ok)}

.card{background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; margin:0 0 12px}
.card h2{font-family:var(--head); font-weight:800; font-size:20px; margin:0 0 6px; line-height:1.2}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.big-rule{font-family:var(--head); font-weight:800; font-size:22px; line-height:1.25; margin:0 0 6px}
.big-rule em{font-style:normal; background:linear-gradient(transparent 60%, color-mix(in srgb,var(--bubble) 30%, transparent) 60%)}

.min-bar{display:flex; gap:3px; border-radius:10px; overflow:hidden; margin:8px 0 4px}
.min-bar span{flex:var(--m) 1 0; background:var(--ink); color:var(--sheet); text-align:center; padding:8px 2px; font-size:13px; font-weight:700; line-height:1.15}
.min-bar span small{display:block; font-weight:400; opacity:.85}
.min-bar span:last-child{background:repeating-linear-gradient(135deg,var(--ink) 0 6px, color-mix(in srgb,var(--ink) 75%, var(--sheet)) 6px 12px)}
.note-s{font-size:14px; color:var(--ink-soft); margin:4px 0 0}

.crit{list-style:none; padding:0; margin:6px 0 0; display:grid; gap:6px}
.crit li{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start; font-size:15.5px}
.crit b{font-family:var(--head); font-size:20px; text-align:center; background:var(--paper); border-radius:8px; padding:2px 0}

.missions{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
.missions button{font:inherit; font-size:14.5px; font-weight:700; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer}
.missions button.on{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.angles{display:grid; gap:8px}
.angle{border:1.5px solid var(--line); border-left:7px solid var(--c); border-radius:8px; padding:9px 12px; font-size:15.5px}
.angle b{font-family:var(--head)}
.angle q{display:block; font-style:italic; margin-top:3px; color:var(--ink-soft)}

/* Choix d'entrée */
.doors{display:grid; gap:10px; margin:4px 0 12px}
.door{display:block; text-align:left; font:inherit; color:var(--ink); background:var(--sheet); border:2.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer}
.door:hover,.door:focus-visible{border-color:var(--ink)}
.door b{display:block; font-family:var(--head); font-weight:800; font-size:20px}
.door small{display:block; color:var(--ink-soft); font-size:15px; margin-top:2px}

/* Damier */
.reminder{background:var(--paper); border-left:4px solid var(--ink); border-radius:0 8px 8px 0; padding:9px 12px; margin:0 0 12px; font-size:15.5px}
.reminder b{display:block; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft)}
.dco{margin:0 0 14px}
.dco h3{font-family:var(--head); font-size:16px; margin:0 0 6px; display:flex; gap:8px; align-items:center; line-height:1.2}
.dco h3 i{font-style:normal; width:28px; height:28px; border-radius:7px; background:var(--c); color:var(--on-c); display:grid; place-items:center; font-weight:800; flex:none}
.dco h3 a{margin-left:auto; font-family:var(--body); font-size:13px; font-weight:700; color:var(--ink-soft); white-space:nowrap}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px}
.tile{font:inherit; text-align:left; color:var(--ink); background:var(--sheet); border:2px solid var(--line); border-top:6px solid var(--c); border-radius:10px; padding:8px 10px 10px; cursor:pointer; min-height:88px; position:relative}
.tile:hover{border-color:var(--c)}
.tile b{display:block; font-family:var(--head); font-weight:800; font-size:20px; line-height:1}
.tile span{display:block; font-size:13.5px; line-height:1.3; margin-top:4px}
.tile.sel{background:var(--c); color:var(--on-c)}
.tile.taken{opacity:.5}
.tile em{display:block; font-style:normal; font-size:12px; font-weight:700; margin-top:4px}
.tile.off{border-style:dashed; border-top:6px dashed var(--line); color:var(--ink-soft); cursor:default; background:transparent}

/* Fiche compétence */
dialog.sheet{border:0; padding:0; width:min(640px,100vw); max-width:100vw; max-height:90vh; margin:auto auto 0; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--sheet); color:var(--ink)}
@media (min-width:700px){ dialog.sheet{margin:auto; border-radius:var(--radius-lg)} }
dialog.sheet::backdrop{background:rgba(10,14,28,.55)}
.sheet-head{background:var(--c); color:var(--on-c); padding:14px 18px 12px; position:sticky; top:0}
.sheet-head .x{position:absolute; top:10px; right:10px; font:inherit; font-size:15px; font-weight:700; border:2px solid currentColor; color:inherit; background:transparent; border-radius:999px; padding:4px 12px; cursor:pointer}
.sheet-head .code{font-family:var(--head); font-weight:800; font-size:28px; line-height:1}
.sheet-head h3{font-family:var(--head); font-weight:800; font-size:19px; line-height:1.2; margin:4px 70px 0 0}
.sheet-body{padding:12px 18px 18px}
.sheet-body h4{font-family:var(--head); font-size:15.5px; margin:12px 0 3px}
.sheet-body p,.sheet-body ul{margin:0 0 6px}
.sheet-body ul{padding-left:20px}
.sheet-body details{border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0}
.sheet-body summary{cursor:pointer; font-weight:700}
.sheet-acts{display:grid; gap:8px; margin-top:14px}
.sheet-acts .btn{justify-content:center; white-space:normal; text-align:center}

/* Questions */
.field{margin:0 0 16px}
.field label{display:block; font-weight:700; margin:0 0 5px; font-size:17px; line-height:1.3}
.field textarea{width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--sheet); border:2px solid var(--line); border-radius:10px; padding:10px 12px; min-height:84px; resize:vertical}
.field textarea:focus{outline:none; border-color:var(--ink)}
.starters{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0}
.starters button{font:inherit; font-size:14px; color:var(--ink); background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer}
.starters button:hover{border-color:var(--ink)}
.tip{font-size:15px; color:var(--ink-soft); margin:-4px 0 14px}
.ifs{display:grid; gap:6px; margin:0 0 14px}
.ifs label{display:flex; gap:10px; align-items:flex-start; border:2px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--sheet); font-size:16px}
.ifs input{width:20px; height:20px; accent-color:var(--ink); margin:2px 0 0; flex:none}
.ifs label:has(input:checked){border-color:var(--ink)}
.nav{display:flex; justify-content:space-between; gap:10px; margin:6px 0 0; position:sticky; bottom:0; padding:10px 0 12px; background:linear-gradient(transparent, var(--paper) 30%)}
.nav .btn{padding:13px 20px; font-size:16px}
.nav .btn.solid{flex:1; justify-content:center; max-width:320px; margin-left:auto}

/* Mon speech */
.speech{background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; margin:0 0 14px}
.speech h2{font-family:var(--head); font-weight:800; font-size:20px; margin:0 0 8px; display:flex; gap:8px; align-items:baseline; line-height:1.2}
.speech h2 i{font-style:normal; background:var(--c); color:var(--on-c); border-radius:6px; padding:0 8px; flex:none}
.sp{border-top:1.5px dashed var(--line); padding:8px 0 6px}
.sp h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 2px}
.sp p{margin:0 0 4px; white-space:pre-wrap; font-size:16.5px}
.sp .empty{color:var(--alert); font-style:italic}
.done-box{text-align:center; padding:18px 10px 6px}
.done-box b{display:block; font-family:var(--head); font-weight:800; font-size:26px}
.actions-col{display:grid; gap:8px; margin:10px 0 0}
.actions-col .btn{justify-content:center}

.foot-src{font-size:13px; color:var(--ink-soft); margin-top:24px}


/* ---- v2 : couleurs par étape, en-têtes pleins ---- */
.intro p{font-size:19px; color:var(--ink)}
.path li .dot{border-color:var(--s); color:var(--s)}
.path li.now .dot, .path li.done .dot{background:var(--s); border-color:var(--s); color:var(--on-s)}
.path li.done::before{background:var(--s)}
.path .stage{border-left:10px solid var(--s)}
.path li.now .stage{border:3px solid var(--s); border-left-width:10px; box-shadow:5px 5px 0 var(--s)}
.path .stage .st, .path li.now .stage .st, .path li.done .stage .st{color:var(--s)}
button.result{width:100%; font:inherit; color:var(--ink); cursor:pointer; text-align:left; border-style:solid}
button.result:hover{border-color:var(--ink)}
button.result span{font-weight:700}
.links ul{gap:6px}
.head{background:var(--s); color:var(--on-s); border-radius:var(--radius-sm); padding:14px 16px 14px; margin:10px 0 14px}
.head .k{color:inherit; opacity:.85; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chip-min{background:var(--on-s); color:var(--s); border-radius:999px; padding:0 9px; font-size:12.5px; letter-spacing:0; text-transform:none; opacity:1}
.head .prog i{background:color-mix(in srgb, var(--on-s) 30%, transparent)}
.head .prog i.on{background:var(--on-s)}
.head .prog i.done{background:color-mix(in srgb, var(--on-s) 70%, transparent)}
.nav .btn.solid, .actions-col .btn.solid{background:var(--s); border-color:var(--s); color:var(--on-s)}
.card h2{display:flex; align-items:center; gap:8px}
.card h2::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--s); flex:none}
.rule-card{border:3px solid var(--s)}
.big-rule em{background:linear-gradient(transparent 58%, color-mix(in srgb,var(--s) 35%, transparent) 58%)}
.min-bar span{background:var(--s); color:var(--on-s)}
.min-bar span:last-child{background:repeating-linear-gradient(135deg,var(--s) 0 6px, color-mix(in srgb,var(--s) 70%, var(--sheet)) 6px 12px)}
.crit{counter-reset:k}
.crit li{display:flex; gap:10px; align-items:baseline; counter-increment:k; font-size:16.5px}
.crit li::before{content:counter(k); flex:none; width:26px; height:26px; border-radius:50%; background:var(--s); color:var(--on-s); display:grid; place-items:center; font-weight:800; font-size:14px; transform:translateY(5px)}
.reminder{border-left-color:var(--s)}
.door{border-left:8px solid var(--s)}
.door:hover,.door:focus-visible{border-color:var(--s)}
.field textarea:focus{border-color:var(--s)}
.tips{list-style:none; padding:0; margin:0 0 12px; display:grid; gap:8px; counter-reset:t}
.tips li{counter-increment:t; display:grid; grid-template-columns:34px 1fr; column-gap:12px; background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px}
.tips li::before{content:counter(t); grid-row:span 2; width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--sheet); display:grid; place-items:center; font-family:var(--head); font-weight:800}
.tips b{font-family:var(--head); font-size:18px}
.tips span{color:var(--ink-soft); font-size:15.5px}
@media print{
  body{background:#fff; color:#000; font-size:11.5pt; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .screen,.bar,.foot-src,dialog{display:none !important}
  #s-speech{display:block !important}
  #s-speech .no-print{display:none !important}
  .speech{border:1px solid #999; break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap narrow">
  <div class="bar">
    <a href="../index.html" id="barBack">&larr; Mon parcours PQual</a>
    <span class="save-state" id="saveState">Enregistré sur cet appareil</span>
  </div>

  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-learn" hidden></section>
  <section class="screen" id="s-co" hidden></section>
  <section class="screen" id="s-speech" hidden></section>
  <section class="screen" id="s-tips" hidden></section>

  <p class="foot-src" id="footSrc" hidden>Sources officielles : présentation PQUAL « Partie pratique 3Cp » (version 28.01.26) et plan de formation employé·e de commerce CFC. Ce qui est marqué est une aide de l'Espace Entreprise. Vos réponses restent sur cet appareil.</p>
</div>

<dialog class="sheet" id="sheet"></dialog>

<script>
const DCO = {
  A:"Travail au sein de structures d'activité et d'organisation dynamiques",
  B:"Interaction dans un milieu de travail interconnecté",
  C:"Coordination des processus de travail en entreprise",
  D:"Gestion des relations avec les clients et les fournisseurs",
  E:"Utilisation des technologies numériques du monde du travail"
};
/* Compétences liées aux options : non sélectionnables pour le TP5 */
const OFF = {
  c6:"Exécuter des travaux de comptabilité financière",
  d5:"Situations exigeantes dans la langue nationale",
  d6:"Situations exigeantes dans la langue étrangère",
  e5:"Mettre en place et gérer des technologies",
  e6:"Évaluer de grandes quantités de données"
};
/* t  = intitulé officiel (profil de qualification)
   off = situation de travail du plan de formation (officiel)
   bref, angle, ex = aides de l'Espace Entreprise (non officiel)
   easy = facile à illustrer à l'Espace Entreprise (non officiel) */
const CO = {
a1:{t:"Examiner et développer des compétences commerciales", easy:0,
 bref:"Faire le point sur ce que vous savez faire, et vous fixer des objectifs pour progresser.",
 angle:"Votre propre progression : un bilan, un objectif que vous vous êtes fixé, ce que vous avez changé.",
 ex:["Préparer et mener votre entretien de bilan de stage","Vous fixer un objectif précis (ex. des courriels sans fautes) et l'atteindre","Demander un retour et changer votre façon de travailler"],
 off:"Les employés de commerce s'informent sur les possibilités de développement dans leur champ professionnel. Ils procèdent régulièrement à un bilan personnel et, en concertation avec leur supérieur hiérarchique, définissent des mesures pour continuer à développer leurs compétences professionnelles."},
a2:{t:"Développer et utiliser des réseaux propres au domaine commercial", easy:0,
 bref:"Créer des contacts utiles et s'en servir pour avancer dans son travail.",
 angle:"Les personnes que vous avez contactées, et ce que ce contact vous a permis d'obtenir.",
 ex:["Trouver la bonne personne dans une autre équipe pour débloquer un dossier","Reprendre contact avec quelqu'un d'un ancien stage pour une information","Vous présenter et créer un contact lors d'un événement"],
 off:"Les employés de commerce développent un réseau spécifique à leur profession et entretiennent leurs contacts avec d'autres professionnels par le biais de divers canaux. Ils utilisent leurs contacts pour se présenter lors de mandats, obtenir des informations pertinentes et échanger sur leurs expériences."},
a3:{t:"Recevoir et exécuter des mandats propres au domaine commercial", easy:1,
 bref:"Recevoir une demande, la comprendre, la réaliser et livrer un résultat qui satisfait.",
 angle:"Le chemin du mandat : comprendre la demande, planifier, livrer, recevoir le retour.",
 ex:["Un mandat reçu de votre formateur, avec un délai serré","Une demande floue que vous avez fait préciser avant de commencer","Un travail rendu, corrigé après un retour, puis validé"],
 off:"Les employés de commerce vendent leur profil de compétence dans des situations de concurrence interne et externe pour des mandats propres au domaine commercial. Ils fournissent des services conformément aux mandats qui leur ont été confiés et vérifient la bonne exécution du mandat à la satisfaction du client. Les employés de commerce réfléchissent à leur réussite, analysent leurs actions et en déduisent des mesures d'amélioration."},
a4:{t:"Agir de manière responsable dans la société", easy:0,
 bref:"Faire des choix réfléchis et responsables, pour soi et pour l'entreprise.",

  soiree:["#FF4FA3","#3EE0F0","#B6F23A","#FFB020","#B590FF"],

};
const pal = PAL[document.documentElement.dataset.skin] || PAL.classique;
function onColor(hex){
  const h = String(hex).replace("#",""); if (h.length !== 6) return "#FFFFFF";
  const ch = i => { const c = parseInt(h.slice(i,i+2),16)/255; return c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  const L = .2126*ch(0) + .7152*ch(2) + .0722*ch(4);
  return L > .36 ? "#12152B" : "#FFFFFF";
}
const colorOf = code => pal["ABCDE".indexOf(code[0].toUpperCase())] || pal[0];
const STEPC = [pal[0], pal[1], pal[3]];
const svars = i => { const c = STEPC[i]; return `--s:${c};--on-s:${onColor(c)}`; };
const cvars = code => { const c = colorOf(code); return `--c:${c};--on-c:${onColor(c)}`; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const $ = id => document.getElementById(id);
const konv = k => (window.KONVINK && window.KONVINK[k]) || "";

    ["chal","Qu'est-ce qui était difficile ?","Ex. La salle était déjà prise et un collègue était absent.",["La difficulté, c'était…","Je ne m'attendais pas à…"]],
    ["did","Qu'avez-vous fait, vous ?","Ex. J'ai trouvé une autre salle, réparti les tâches et envoyé l'invitation.",["D'abord…","Ensuite…","Enfin…"]],
    ["res","Quel a été le résultat ?","Ex. La séance a eu lieu à l'heure, tout le monde avait les documents.",["Résultat :","Ma responsable m'a dit…"]]]},
  analysis:{h:"Avec le recul", min:"2 min", fields:[
    ["work","Qu'est-ce qui a fait que ça a marché ?","Ex. J'ai demandé de l'aide tôt et j'ai tenu une liste à jour.",["Ça a marché parce que…","Mon point fort, c'est…"]],
    ["next","Que feriez-vous autrement la prochaine fois ?","Ex. Réserver la salle dès le premier jour.",["La prochaine fois, je…","Je changerais…"]]]},
  alt:{h:"Et si… ?", min:"1 min", ifs:true, fields:[
    ["altA","Ce que vous auriez fait","Ex. J'aurais d'abord appelé la personne pour comprendre, puis proposé une solution.",["Dans ce cas, j'aurais…","D'abord je…, ensuite je…"]]]}
};
const FIELDS = ["like","strong","where","task","chal","did","res","work","next","altA"];
const seqOf = i => ["start", ...(S.entry[i] === "mission" ? ["mission","pick"] : ["pick","mission"]), "why","context","challenge","analysis","alt","done"];
const nFilled = i => FIELDS.filter(f => has(S.prep[i][f])).length + (S.sel[i] ? 1 : 0);
const NTOT = FIELDS.length + 1;
const coDone = i => !!S.sel[i] && ["like","where","task","did","work","next"].every(f => has(S.prep[i][f]));

/* =====================================================================
   NAVIGATION
   ===================================================================== */
let cur = "home", ci = 0;
function go(to, push){
  if (to === "co1" || to === "co2"){ ci = to === "co1" ? 0 : 1; to = "co"; }
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== "s-"+to);
  cur = to;
  ({home:renderHome, learn:renderLearn, co:renderCo, speech:renderSpeech, tips:renderTips}[to])();
  const sv = to === "learn" ? 0 : to === "co" ? ci + 1 : -1;
  $("s-"+to).style.cssText = (to === "co" && S.sel[ci] ? cvars(S.sel[ci]) + ";" : "") + (sv >= 0 ? svars(sv) : "--s:var(--ink);--on-s:var(--sheet)");
  $("saveState").hidden = to === "home";
  window.scrollTo(0,0);
  const h = to === "co" ? "co"+(ci+1) : to;
  try{ if (push !== false && location.hash.slice(1) !== h) history.pushState(null, "", "#"+h); }catch(e){}
}
window.addEventListener("popstate", () => route());
function route(){ const h = (location.hash || "").slice(1); go(["learn","co1","co2","speech","tips"].includes(h) ? h : "home", false); }
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b){ e.preventDefault(); go(b.dataset.go); } });

/* =====================================================================
   ACCUEIL : LE CHEMIN EN 3 ÉTAPES
   ===================================================================== */
function renderHome(){
  const st = [S.learned, coDone(0), coDone(1)];
  const nextI = st.indexOf(false);
  const label = (i, started) => st[i] ? "Fait" : i === nextI ? (started ? "Continuer ici" : "Commencer ici") : started ? "En cours" : "À faire";
  const coLine = i => S.sel[i]
    ? `<span class="co-pill" style="${cvars(S.sel[i])}">${S.sel[i]}</span>${esc(CO[S.sel[i]].t)}`
    : (i === 0 ? "Choisir, puis préparer" : "La même chose, une 2e fois");
  const items = [
    ["learn", "Comprendre la consigne", "2 minutes de lecture", S.learned],
    ["co1", "Ma compétence 1", coLine(0), nFilled(0) > 0],
    ["co2", "Ma compétence 2", coLine(1), nFilled(1) > 0]
  ];
  const any = nFilled(0) + nFilled(1) > 0;
  $("s-home").innerHTML = `
    <div class="intro">
      <h1>Mon TP5,<br>pas à pas</h1>
      <p><b>10 minutes</b> · <b>2 compétences</b> · <b>3 étapes</b></p>
    </div>
    <ol class="path">${items.map(([to,t,s,started],i) => `
      <li class="${st[i]?"done":""}${i===nextI?" now":""}" style="${svars(i)}"><span class="dot">${st[i]?"&#10003;":i+1}</span>
        <button class="stage" data-go="${to}"><span class="st">${label(i, started)}</span><b>${t}</b><small>${s}</small></button></li>`).join("")}
    </ol>
    ${any ? `<button class="result" data-go="speech"><b>Mon speech</b><span>Relire · PDF &rarr;</span></button>` : ""}
    <div class="links"><ul>
      <li><a href="#tips" data-go="tips">Les conseils du coach <span>&rarr;</span></a></li>
      <li><a href="${esc(konv("accueil"))}" target="_blank" rel="noopener">Le Guide pratique <span>Konvink</span></a></li>
      <li><a href="simulation-tp.html">Le simulateur d'examen <span>TP1 à TP5</span></a></li>
    </ul></div>`;
  $("barBack").textContent = "← Mon parcours PQual"; $("barBack").href = "../index.html"; $("barBack").onclick = null;
}

/* =====================================================================
   ÉTAPE 1 : COMPRENDRE LA CONSIGNE
   ===================================================================== */
let mi = 0;
function renderLearn(){
  backHome();
  $("s-learn").innerHTML = `
    <div class="head"><div class="k">Étape 1</div><h1>Comprendre la consigne</h1></div>
    <div class="card rule-card">
      <p class="big-rule">Racontez <em>une mission que vous avez vraiment faite</em>, et réussie, sous l'angle d'<em>une compétence</em>.</p>
    </div>
    <div class="card">
      <h2>5 minutes par compétence</h2>
      <div class="min-bar">
        <span style="--m:1">Pourquoi<small>1'</small></span><span style="--m:1">Situation<small>1'</small></span><span style="--m:2">Analyse<small>2'</small></span><span style="--m:1">Et si…<small>1'</small></span>
      </div>
    </div>
    <div class="card">
      <h2>Une mission, plusieurs angles</h2>
      <div class="missions" id="missions"></div>
      <div class="angles" id="angles"></div>
    </div>
    <div class="card">
      <h2>Ce que les expert·e·s regardent</h2>
      <ul class="crit">
        <li>Pourquoi ce choix, et une situation claire</li>
        <li>Ce qui était difficile, ce qui a marché, ce que vous changeriez</li>
        <li>Ce que vous feriez si c'était différent</li>
      </ul>
    </div>
    <div class="nav"><button class="btn solid" id="learnOk">C'est clair &rarr;</button></div>`;
  renderMissions();
  $("learnOk").onclick = () => { S.learned = true; save(); go("co1"); };
}
function renderMissions(){
  $("missions").innerHTML = MISSIONS.slice(0,4).map((x,i) => `<button class="${i===mi?"on":""}" data-m="${i}">${esc(x.m)}</button>`).join("");
  $("missions").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mi = +b.dataset.m; renderMissions(); });
  $("angles").innerHTML = MISSIONS[mi].a.map(([k,how,first]) =>
    `<div class="angle" style="${cvars(k)}"><b>${k}</b> · ${esc(how)}<q>${esc(first)}</q></div>`).join("");
}
const TIPS = [
  ["Une vraie mission", "Que vous avez faite vous-même, à l'Espace Entreprise."],
  ["Une réussite", "Un défi relevé, pas un échec. Vous pouvez parler de ce qui était difficile."],
  ["Parlez de vous", "« J'ai fait… », pas « on a fait… »."],
  ["L'analyse compte", "Ce qui a marché et ce que vous changeriez : c'est là qu'on fait la différence."],
  ["Préparez le « Et si… »", "Si vous parlez bien, on ne vous coupe pas toujours. Mais soyez prêt·e."],
  ["Vos mandats pratiques", "Ils peuvent vous donner des idées. Ce n'est pas obligatoire de les reprendre."],
  ["À voix haute", "Répétez sans lire, plusieurs fois. Chronométrez-vous : 5 minutes par compétence."]
];
function renderTips(){
  backHome();
  $("s-tips").innerHTML = `<div class="head"><div class="k">Mon TP5</div><h1>Les conseils du coach</h1></div>
    <ol class="tips">${TIPS.map(([t,d]) => `<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ol>
    <div class="nav"><button class="btn solid" data-go="home">Retour à mes 3 étapes</button></div>`;
}
function backHome(){ $("barBack").textContent = "← Mes 3 étapes"; $("barBack").href = "#home"; $("barBack").onclick = e => { e.preventDefault(); go("home"); }; }

/* =====================================================================
   ÉTAPES 2 ET 3 : PRÉPARER UNE COMPÉTENCE
   ===================================================================== */
function renderCo(){
  backHome();
  const seq = seqOf(ci);
  let st = Math.min(S.step[ci] || 0, seq.length - 1);
  if (seq[st] !== "start" && !S.entry[ci]) st = 0;
  const kind = seq[st], k = S.sel[ci], p = S.prep[ci];
  const visible = seq.filter(x => x !== "start" && x !== "done");
  const pos = visible.indexOf(kind);
  document.getElementById("s-co").setAttribute("style", (k ? cvars(k) + ";" : "") + svars(ci + 1));
  let h = `<div class="head"><div class="k">Étape ${ci+2} · Compétence ${ci+1}${k?` · ${k}`:""}${Q[kind]?`<span class="chip-min">${Q[kind].min}</span>`:""}</div><h1>${headTitle(kind)}</h1>
    ${kind!=="start" ? `<div class="prog">${visible.map((_,j) => `<i class="${j<pos||kind==="done"?"done":j===pos?"on":""}"></i>`).join("")}</div>` : ""}</div>`;

  if (kind === "start"){
    if (k) h += `<div class="reminder"><b>Déjà choisie</b>${k} · ${esc(CO[k].t)}</div>`;
    h += `<div class="doors">
        <button class="door" data-entry="co"><b>J'ai une compétence en tête</b><small>Je la choisis, puis je trouve la mission.</small></button>
        <button class="door" data-entry="mission"><b>J'ai une mission en tête</b><small>Je la décris, puis je choisis l'angle.</small></button>
      </div>
      ${ci===1 && !S.sel[0] ? `<p class="note-s">Conseil : commencez plutôt par la <a href="#co1" data-go="co1">compétence 1</a>.</p>` : ""}`;
  }
  else if (kind === "pick"){
    if (has(p.mission)) h += `<div class="reminder"><b>Votre mission</b>${esc(p.mission)}</div>`;
    h += `<p class="tip" style="margin-top:0">Touchez une compétence.</p>` + damier();
  }
  else if (kind === "mission"){
    h += `${k ? "" : `<p class="tip" style="margin-top:0">Une mission vraiment faite, et réussie.</p>`}
      ${k ? `<div class="reminder"><b>${k} · l'angle à prendre</b>${esc(CO[k].angle)}</div>` : ""}
      <div class="field"><label for="f-mission">Votre mission, en une phrase</label>
      <textarea id="f-mission" data-f="mission" rows="2" placeholder="Ex. J'ai organisé la séance d'équipe du jeudi.">${esc(p.mission||"")}</textarea>
      <div class="starters"><button type="button" data-start="mission">J'ai…</button><button type="button" data-start="mission">On m'a demandé de…</button></div></div>
      ${k ? `<details class="card" style="padding:10px 14px"><summary style="cursor:pointer;font-weight:700">Des idées pour ${k}</summary><ul style="margin:8px 0 0;padding-left:20px">${CO[k].ex.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}`;
  }
  else if (Q[kind]){
    const q = Q[kind];
    if (kind === "why") h += `<div class="reminder"><b>${k} · l'angle à prendre</b>${esc(CO[k].angle)}</div>`;
    if (q.ifs) h += `<div class="ifs">${IFS.map((x,j) => `<label><input type="radio" name="ifq" value="${j}" ${String(p.altQ)===String(j)?"checked":""}><span>${esc(x)}</span></label>`).join("")}</div>`;
    h += q.fields.map(([f,lab,ph,starts]) => {
      const val = p[f] != null ? p[f] : (f === "task" && has(p.mission) ? p.mission : "");
      return `<div class="field"><label for="f-${f}">${esc(lab)}</label>
      <textarea id="f-${f}" data-f="${f}" rows="3" placeholder="${esc(ph)}">${esc(val)}</textarea>
      <div class="starters">${starts.map(s => `<button type="button" data-start="${f}">${esc(s)}</button>`).join("")}</div></div>`;
    }).join("");
  }
  else if (kind === "done"){
    h += `<div class="done-box"><b>Compétence ${ci+1} prête</b></div>` + speechCard(ci) +
      `<div class="actions-col">${ci===0 ? `<button class="btn solid" data-go="co2">Passer à ma compétence 2 &rarr;</button>` : `<button class="btn solid" data-go="speech">Voir mon speech complet</button>`}
       <button class="btn" data-go="home">Retour à mes 3 étapes</button></div>`;
  }

  if (kind !== "start" && kind !== "done"){
    const canNext = kind === "pick" ? !!k : true;
    h += `<div class="nav"><button class="btn" id="bPrev" aria-label="Précédent">&larr;</button>
      ${canNext ? `<button class="btn solid" id="bNext">${kind==="alt"?"Terminer":kind==="pick"?`Continuer avec ${k}`:"Suivant"} &rarr;</button>` : ""}</div>`;
  }
  $("s-co").innerHTML = h;

  /* liaisons */
  $("s-co").querySelectorAll("[data-entry]").forEach(b => b.onclick = () => {
    S.entry[ci] = b.dataset.entry; S.step[ci] = 1; save(); renderCo(); window.scrollTo(0,0);
  });
  $("s-co").querySelectorAll("textarea").forEach(t => {
    if (t.dataset.f === "task" && p.task == null && has(t.value)) p.task = t.value;
    t.addEventListener("input", () => { p[t.dataset.f] = t.value; setSave("Enregistrement…"); clearTimeout(saveT); saveT = setTimeout(save, 400); });
  });
  $("s-co").querySelectorAll("[data-start]").forEach(b => b.onclick = () => {
    const t = $("f-"+b.dataset.start); const sep = t.value && !/\s$/.test(t.value) ? " " : "";
    t.value += sep + b.textContent + " "; t.dispatchEvent(new Event("input")); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  });
  $("s-co").querySelectorAll("[name=ifq]").forEach(r => r.onchange = () => { p.altQ = r.value; save(); });
  $("s-co").querySelectorAll("[data-co]").forEach(b => b.onclick = () => openSheet(b.dataset.co));
  const move = d => { clearTimeout(saveT); S.step[ci] = Math.max(0, Math.min(seq.length-1, st + d)); save(); renderCo(); window.scrollTo(0,0); };
  if ($("bPrev")) $("bPrev").onclick = () => move(-1);
  if ($("bNext")) $("bNext").onclick = () => { if (kind === "pick" && !S.sel[ci]) return; move(1); };
}
function headTitle(kind){
  return {start:"Par où commencer ?", pick:"Choisir la compétence", mission:"Votre mission", done:"Bravo"}[kind] || Q[kind].h;
}

/* Damier des compétences */
function damier(){
  const other = S.sel[1-ci];
  return "ABCDE".split("").map(L => {
    const codes = Object.keys(CO).filter(k => k[0] === L.toLowerCase());
    const offs = Object.keys(OFF).filter(k => k[0] === L.toLowerCase());
    const dl = konv(L);
    return `<div class="dco" style="${cvars(L)}"><h3><i>${L}</i>${esc(DCO[L])}${dl?`<a href="${esc(dl)}" target="_blank" rel="noopener">Guide</a>`:""}</h3>
      <div class="tiles">${codes.map(k => {
        const mine = S.sel[ci] === k, taken = other === k;
        return `<button class="tile${mine?" sel":""}${taken?" taken":""}" data-co="${k}"><b>${k}</b><span>${esc(CO[k].t)}</span>${mine?"<em>Mon choix</em>":taken?`<em>Déjà choisie (compétence ${2-ci})</em>`:""}</button>`;
      }).join("")}${offs.map(k => `<div class="tile off"><b>${k}</b><span>${esc(OFF[k])}</span><em>Option, non sélectionnable</em></div>`).join("")}</div></div>`;
  }).join("");
}
function openSheet(k){
  const c = CO[k], d = $("sheet"), link = konv(k);
  const mine = S.sel[ci] === k, taken = S.sel[1-ci] === k;
  d.setAttribute("style", cvars(k));
  d.innerHTML = `<div class="sheet-head"><button class="x" id="shX" autofocus>Fermer</button><div class="code">${k}</div><h3>${esc(c.t)}</h3></div>
   <div class="sheet-body">
    <h4>L'angle à prendre</h4><p>${esc(c.angle)}</p>
    <h4>Des idées à l'Espace Entreprise</h4>
    <ul>${c.ex.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <details><summary>Le texte officiel</summary><p style="margin-top:8px">${esc(c.off)}</p></details>
    <div class="sheet-acts">
      ${taken ? `<button class="btn" disabled>Déjà choisie pour la compétence ${2-ci}</button>`
        : mine ? `<button class="btn solid" id="shKeep">Garder ${k} &rarr;</button>`
        : `<button class="btn solid" id="shAdd">Je choisis ${k} &rarr;</button>`}
      ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Ouvrir la théorie (Guide pratique)</a>` : ""}
    </div>
   </div>`;
  const close = () => { d.close(); };
  $("shX").onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  const pick = () => { S.sel[ci] = k; S.step[ci] = seqOf(ci).indexOf("pick") + 1; save(); close(); renderCo(); window.scrollTo(0,0); };
  if ($("shAdd")) $("shAdd").onclick = pick;
  if ($("shKeep")) $("shKeep").onclick = pick;
  if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open","");
  d.scrollTop = 0;
}

/* =====================================================================
   MON SPEECH (relecture, PDF)
   ===================================================================== */
function speechCard(i){
  const k = S.sel[i], p = S.prep[i];
  if (!k) return `<div class="speech"><h2>Compétence ${i+1}</h2><p class="empty" style="color:var(--alert);font-style:italic;margin:0">Pas encore choisie.</p></div>`;
  const line = v => has(v) ? `<p>${esc(v.trim())}</p>` : "";
  const part = (t, vals) => `<div class="sp"><h3>${t}</h3>${vals.some(has) ? vals.map(line).join("") : `<p class="empty">à compléter</p>`}</div>`;
  return `<div class="speech" style="${cvars(k)}"><h2><i>${k}</i>${esc(CO[k].t)}</h2>
    ${part("Pourquoi cette compétence · 1 min", [p.like, p.strong])}
    ${part("La situation · 1 min", [p.where, p.task, p.chal, p.did, p.res])}
    ${part("Avec le recul · 2 min", [p.work, p.next])}
    ${part("Et si… · 1 min", [p.altQ != null && p.altQ !== "" ? IFS[+p.altQ] : "", p.altA])}
  </div>`;
}
function renderSpeech(){
  backHome();
  $("s-speech").innerHTML = `<div class="head"><div class="k">Mon TP5</div><h1>Mon speech</h1></div>
    <div class="actions-col no-print" style="margin:0 0 14px"><button class="btn solid" id="bPdf">Enregistrer en PDF</button></div>
    ${speechCard(0)}${speechCard(1)}
    <div class="actions-col no-print"><button class="btn" data-go="home">Retour à mes 3 étapes</button></div>`;
  $("bPdf").onclick = () => window.print();
}

route();
</script>
</body>
</html>
