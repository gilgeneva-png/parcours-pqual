<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon TP5 (test)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='22' rx='5' fill='%231F2A44'/%3E%3Crect x='7' y='12' width='8' height='4' rx='2' fill='%232F6CC4'/%3E%3Crect x='13' y='18' width='12' height='4' rx='2' fill='%23C43E57'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/konvink.js"></script>
<script>
/* Même thème que le site (choisi sur l'accueil, mémorisé sur l'appareil) */
(function(){
  var r = document.documentElement;
  try{ var k = localStorage.getItem("mp-theme"); if (k) r.dataset.skin = k; }catch(e){}
  try{ var p = JSON.parse(localStorage.getItem("mp-prefs") || "{}") || {};
       ["big","plain","still"].forEach(function(x){ if (p[x]) r.setAttribute("data-"+x, ""); }); }catch(e){}
})();
</script>
<style>
:root{ --c:#2F6CC4; --on-c:#fff; --ok:#2E8558; }
body{padding-bottom:48px}
.wrap.narrow{max-width:680px}
[hidden]{display:none !important}
.btn.solid:hover{background:var(--ink); color:var(--sheet); opacity:.88}

/* Barre du haut */
.bar{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:14px; min-height:44px}
.bar a,.bar button.link{font:inherit; font-weight:700; text-decoration:none; color:var(--ink-soft); font-size:15px; background:none; border:0; padding:0; cursor:pointer}
.bar a:hover,.bar button.link:hover{color:var(--ink)}
.save-state{font-size:12.5px; color:var(--ink-soft)}

/* Étiquettes de source */
.tag-off,.tag-no{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:999px; padding:1px 7px; vertical-align:2px; margin-left:4px; white-space:nowrap}
.tag-off{background:var(--ink); color:var(--sheet)}
.tag-no{border:1.5px dashed var(--ink-soft); color:var(--ink-soft)}

/* Accueil du coach */
.intro h1{font-family:var(--head); font-weight:800; font-size:clamp(30px,8vw,44px); line-height:1.02; letter-spacing:-.02em; margin:18px 0 8px}
.intro p{margin:0 0 18px; font-size:18px; color:var(--ink-soft)}
.intro p b{color:var(--ink)}

.path{list-style:none; padding:0; margin:0 0 22px; position:relative}
.path li{position:relative; padding-left:62px; margin:0 0 12px}
.path li::before{content:""; position:absolute; left:23px; top:46px; bottom:-14px; width:3px; background:var(--line); border-radius:2px}
.path li:last-child::before{display:none}
.path li.done::before{background:var(--ok)}
.path .dot{position:absolute; left:0; top:8px; width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--head); font-weight:800; font-size:22px; background:var(--sheet); border:3px solid var(--line); color:var(--ink-soft); z-index:1}
.path li.now .dot{border-color:var(--ink); color:var(--ink)}
.path li.done .dot{background:var(--ok); border-color:var(--ok); color:#fff}
.stage{display:block; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--sheet); border:2px solid var(--line);
  border-radius:var(--radius-sm); padding:14px 16px; cursor:pointer; text-decoration:none}
.stage:hover{border-color:var(--ink)}
.path li.now .stage{border:3px solid var(--ink); box-shadow:5px 5px 0 var(--bubble)}
.stage .st{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft)}
.path li.now .stage .st{color:var(--bubble)}
.path li.done .stage .st{color:var(--ok)}
.stage b{display:block; font-family:var(--head); font-weight:800; font-size:21px; line-height:1.15; margin:2px 0 3px}
.stage small{display:block; font-size:15px; color:var(--ink-soft); line-height:1.35}
.stage .co-pill{display:inline-block; font-family:var(--head); font-weight:800; font-size:14px; background:var(--c); color:var(--on-c); border-radius:6px; padding:0 7px; margin-right:6px}

.result{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--sheet); border:2px dashed var(--line); border-radius:var(--radius-sm); padding:12px 16px; margin:0 0 22px}
.result b{font-family:var(--head); font-size:17px}
.result small{display:block; color:var(--ink-soft); font-size:14px}

.links h2{font-family:var(--head); font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 8px}
.links ul{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.links a{display:flex; justify-content:space-between; gap:10px; text-decoration:none; font-weight:700; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px}
.links a:hover{border-color:var(--ink)}
.links a span{font-weight:400; color:var(--ink-soft); font-size:14px}

/* Écrans d'étape */
.head{margin:10px 0 14px}
.head .k{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft)}
.head h1{font-family:var(--head); font-weight:800; font-size:clamp(26px,7vw,34px); line-height:1.08; margin:2px 0 0; letter-spacing:-.01em}
.prog{display:flex; gap:5px; margin:10px 0 0}
.prog i{flex:1; height:6px; border-radius:3px; background:var(--line)}
.prog i.on{background:var(--ink)}
.prog i.done{background:var(--ok)}

.card{background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; margin:0 0 12px}
.card h2{font-family:var(--head); font-weight:800; font-size:20px; margin:0 0 6px; line-height:1.2}
.card p{margin:0 0 8px}
.card p:last-child{margin-bottom:0}
.big-rule{font-family:var(--head); font-weight:800; font-size:22px; line-height:1.25; margin:0 0 6px}
.big-rule em{font-style:normal; background:linear-gradient(transparent 60%, color-mix(in srgb,var(--bubble) 30%, transparent) 60%)}

.min-bar{display:flex; gap:3px; border-radius:10px; overflow:hidden; margin:8px 0 4px}
.min-bar span{flex:var(--m) 1 0; background:var(--ink); color:var(--sheet); text-align:center; padding:8px 2px; font-size:13px; font-weight:700; line-height:1.15}
.min-bar span small{display:block; font-weight:400; opacity:.85}
.min-bar span:last-child{background:repeating-linear-gradient(135deg,var(--ink) 0 6px, color-mix(in srgb,var(--ink) 75%, var(--sheet)) 6px 12px)}
.note-s{font-size:14px; color:var(--ink-soft); margin:4px 0 0}

.crit{list-style:none; padding:0; margin:6px 0 0; display:grid; gap:6px}
.crit li{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start; font-size:15.5px}
.crit b{font-family:var(--head); font-size:20px; text-align:center; background:var(--paper); border-radius:8px; padding:2px 0}

.missions{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
.missions button{font:inherit; font-size:14.5px; font-weight:700; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer}
.missions button.on{background:var(--ink); color:var(--sheet); border-color:var(--ink)}
.angles{display:grid; gap:8px}
.angle{border:1.5px solid var(--line); border-left:7px solid var(--c); border-radius:8px; padding:9px 12px; font-size:15.5px}
.angle b{font-family:var(--head)}
.angle q{display:block; font-style:italic; margin-top:3px; color:var(--ink-soft)}

/* Choix d'entrée */
.doors{display:grid; gap:10px; margin:4px 0 12px}
.door{display:block; text-align:left; font:inherit; color:var(--ink); background:var(--sheet); border:2.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; cursor:pointer}
.door:hover,.door:focus-visible{border-color:var(--ink)}
.door b{display:block; font-family:var(--head); font-weight:800; font-size:20px}
.door small{display:block; color:var(--ink-soft); font-size:15px; margin-top:2px}

/* Damier */
.reminder{background:var(--paper); border-left:4px solid var(--ink); border-radius:0 8px 8px 0; padding:9px 12px; margin:0 0 12px; font-size:15.5px}
.reminder b{display:block; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft)}
.dco{margin:0 0 14px}
.dco h3{font-family:var(--head); font-size:16px; margin:0 0 6px; display:flex; gap:8px; align-items:center; line-height:1.2}
.dco h3 i{font-style:normal; width:28px; height:28px; border-radius:7px; background:var(--c); color:var(--on-c); display:grid; place-items:center; font-weight:800; flex:none}
.dco h3 a{margin-left:auto; font-family:var(--body); font-size:13px; font-weight:700; color:var(--ink-soft); white-space:nowrap}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:8px}
.tile{font:inherit; text-align:left; color:var(--ink); background:var(--sheet); border:2px solid var(--line); border-top:6px solid var(--c); border-radius:10px; padding:8px 10px 10px; cursor:pointer; min-height:88px; position:relative}
.tile:hover{border-color:var(--c)}
.tile b{display:block; font-family:var(--head); font-weight:800; font-size:20px; line-height:1}
.tile span{display:block; font-size:13.5px; line-height:1.3; margin-top:4px}
.tile.sel{background:var(--c); color:var(--on-c)}
.tile.taken{opacity:.5}
.tile em{display:block; font-style:normal; font-size:12px; font-weight:700; margin-top:4px}
.tile.off{border-style:dashed; border-top:6px dashed var(--line); color:var(--ink-soft); cursor:default; background:transparent}

/* Fiche compétence */
dialog.sheet{border:0; padding:0; width:min(640px,100vw); max-width:100vw; max-height:90vh; margin:auto auto 0; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--sheet); color:var(--ink)}
@media (min-width:700px){ dialog.sheet{margin:auto; border-radius:var(--radius-lg)} }
dialog.sheet::backdrop{background:rgba(10,14,28,.55)}
.sheet-head{background:var(--c); color:var(--on-c); padding:14px 18px 12px; position:sticky; top:0}
.sheet-head .x{position:absolute; top:10px; right:10px; font:inherit; font-size:15px; font-weight:700; border:2px solid currentColor; color:inherit; background:transparent; border-radius:999px; padding:4px 12px; cursor:pointer}
.sheet-head .code{font-family:var(--head); font-weight:800; font-size:28px; line-height:1}
.sheet-head h3{font-family:var(--head); font-weight:800; font-size:19px; line-height:1.2; margin:4px 70px 0 0}
.sheet-body{padding:12px 18px 18px}
.sheet-body h4{font-family:var(--head); font-size:15.5px; margin:12px 0 3px}
.sheet-body p,.sheet-body ul{margin:0 0 6px}
.sheet-body ul{padding-left:20px}
.sheet-body details{border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; margin:10px 0}
.sheet-body summary{cursor:pointer; font-weight:700}
.sheet-acts{display:grid; gap:8px; margin-top:14px}
.sheet-acts .btn{justify-content:center; white-space:normal; text-align:center}

/* Questions */
.field{margin:0 0 16px}
.field label{display:block; font-weight:700; margin:0 0 5px; font-size:17px; line-height:1.3}
.field textarea{width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--sheet); border:2px solid var(--line); border-radius:10px; padding:10px 12px; min-height:84px; resize:vertical}
.field textarea:focus{outline:none; border-color:var(--ink)}
.starters{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 0}
.starters button{font:inherit; font-size:14px; color:var(--ink); background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer}
.starters button:hover{border-color:var(--ink)}
.tip{font-size:15px; color:var(--ink-soft); margin:-4px 0 14px}
.ifs{display:grid; gap:6px; margin:0 0 14px}
.ifs label{display:flex; gap:10px; align-items:flex-start; border:2px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--sheet); font-size:16px}
.ifs input{width:20px; height:20px; accent-color:var(--ink); margin:2px 0 0; flex:none}
.ifs label:has(input:checked){border-color:var(--ink)}
.nav{display:flex; justify-content:space-between; gap:10px; margin:6px 0 0; position:sticky; bottom:0; padding:10px 0 12px; background:linear-gradient(transparent, var(--paper) 30%)}
.nav .btn{padding:13px 20px; font-size:16px}
.nav .btn.solid{flex:1; justify-content:center; max-width:320px; margin-left:auto}

/* Mon speech */
.speech{background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; margin:0 0 14px}
.speech h2{font-family:var(--head); font-weight:800; font-size:20px; margin:0 0 8px; display:flex; gap:8px; align-items:baseline; line-height:1.2}
.speech h2 i{font-style:normal; background:var(--c); color:var(--on-c); border-radius:6px; padding:0 8px; flex:none}
.sp{border-top:1.5px dashed var(--line); padding:8px 0 6px}
.sp h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 2px}
.sp p{margin:0 0 4px; white-space:pre-wrap; font-size:16.5px}
.sp .empty{color:var(--alert); font-style:italic}
.done-box{text-align:center; padding:18px 10px 6px}
.done-box b{display:block; font-family:var(--head); font-weight:800; font-size:26px}
.actions-col{display:grid; gap:8px; margin:10px 0 0}
.actions-col .btn{justify-content:center}

.foot-src{font-size:13px; color:var(--ink-soft); margin-top:24px}


/* ---- v2 : couleurs par étape, en-têtes pleins ---- */
.intro p{font-size:19px; color:var(--ink)}
.path li .dot{border-color:var(--s); color:var(--s)}
.path li.now .dot, .path li.done .dot{background:var(--s); border-color:var(--s); color:var(--on-s)}
.path li.done::before{background:var(--s)}
.path .stage{border-left:10px solid var(--s)}
.path li.now .stage{border:3px solid var(--s); border-left-width:10px; box-shadow:5px 5px 0 var(--s)}
.path .stage .st, .path li.now .stage .st, .path li.done .stage .st{color:var(--s)}
button.result{width:100%; font:inherit; color:var(--ink); cursor:pointer; text-align:left; border-style:solid}
button.result:hover{border-color:var(--ink)}
button.result span{font-weight:700}
.links ul{gap:6px}
.head{background:var(--s); color:var(--on-s); border-radius:var(--radius-sm); padding:14px 16px 14px; margin:10px 0 14px}
.head .k{color:inherit; opacity:.85; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.chip-min{background:var(--on-s); color:var(--s); border-radius:999px; padding:0 9px; font-size:12.5px; letter-spacing:0; text-transform:none; opacity:1}
.head .prog i{background:color-mix(in srgb, var(--on-s) 30%, transparent)}
.head .prog i.on{background:var(--on-s)}
.head .prog i.done{background:color-mix(in srgb, var(--on-s) 70%, transparent)}
.nav .btn.solid, .actions-col .btn.solid{background:var(--s); border-color:var(--s); color:var(--on-s)}
.card h2{display:flex; align-items:center; gap:8px}
.card h2::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--s); flex:none}
.rule-card{border:3px solid var(--s)}
.big-rule em{background:linear-gradient(transparent 58%, color-mix(in srgb,var(--s) 35%, transparent) 58%)}
.min-bar span{background:var(--s); color:var(--on-s)}
.min-bar span:last-child{background:repeating-linear-gradient(135deg,var(--s) 0 6px, color-mix(in srgb,var(--s) 70%, var(--sheet)) 6px 12px)}
.crit{counter-reset:k}
.crit li{display:flex; gap:10px; align-items:baseline; counter-increment:k; font-size:16.5px}
.crit li::before{content:counter(k); flex:none; width:26px; height:26px; border-radius:50%; background:var(--s); color:var(--on-s); display:grid; place-items:center; font-weight:800; font-size:14px; transform:translateY(5px)}
.reminder{border-left-color:var(--s)}
.door{border-left:8px solid var(--s)}
.door:hover,.door:focus-visible{border-color:var(--s)}
.field textarea:focus{border-color:var(--s)}
.tips{list-style:none; padding:0; margin:0 0 12px; display:grid; gap:8px; counter-reset:t}
.tips li{counter-increment:t; display:grid; grid-template-columns:34px 1fr; column-gap:12px; background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px}
.tips li::before{content:counter(t); grid-row:span 2; width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--sheet); display:grid; place-items:center; font-family:var(--head); font-weight:800}
.tips b{font-family:var(--head); font-size:18px}
.tips span{color:var(--ink-soft); font-size:15.5px}
.reset{margin:22px 0 0; text-align:center}
.reset .btn{border-color:var(--line); color:var(--ink-soft); font-size:14px; padding:8px 16px}
.reset .btn:hover{border-color:var(--ink); background:transparent; color:var(--ink)}
.reset .btn.armed{border-color:var(--alert); background:var(--alert); color:#fff}
.reset small{display:block; margin-top:6px; font-size:13.5px; color:var(--alert)}

/* ---- v3 ---- */
.path li.grp{padding-left:0; margin:6px 0 8px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft)}
.path li.grp::before{display:none}
.path li.grp ~ li.grp{margin-top:18px}
.erase{display:inline-block; margin:6px 0 0; font:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); background:none; border:0; padding:4px 0; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.erase:hover{color:var(--ink)}
.erase.armed{color:#fff; background:var(--alert); text-decoration:none; border-radius:999px; padding:5px 12px}
.say{font-size:18px; margin:0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 12px}
.two div{background:var(--s); color:var(--on-s); border-radius:var(--radius-sm); padding:14px; text-align:center}
.two b{display:block; font-family:var(--head); font-size:18px}
.two span{display:block; font-family:var(--head); font-weight:800; font-size:30px; line-height:1.1}
.parts{margin:12px 0 0; display:grid; gap:8px}
.parts div{display:grid; grid-template-columns:92px 1fr; gap:10px; align-items:baseline; border-top:1.5px dashed var(--line); padding-top:8px}
.parts dt{font-family:var(--head); font-weight:800; color:var(--s)}
.parts dd{margin:0; font-size:16px}
.yesno{list-style:none; padding:0; margin:0 0 12px; display:grid; gap:8px}
.yesno li{display:flex; gap:10px; align-items:baseline; background:var(--sheet); border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; font-size:16.5px}
.yesno li::before{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px; transform:translateY(4px)}
.yesno li.y::before{content:"✓"; background:var(--s); color:var(--on-s)}
.yesno li.n::before{content:"✕"; background:var(--line); color:var(--ink)}
.yesno li.n{color:var(--ink-soft)}
.next-steps ol{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:6px}
.next-steps li{border-left:8px solid var(--s); background:var(--paper); border-radius:6px; padding:8px 12px; font-size:16.5px}
.next-steps li.end{border-left-color:var(--ink)}
.next-steps li b{display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft)}
.angles-help{padding:10px 14px}
.angles-help summary{cursor:pointer; font-weight:700}

/* ---- v4 ---- */
.path li::before{left:22px; width:4px; top:54px; bottom:-6px; background:var(--s); opacity:.55; border-radius:2px}
.path li::after{content:""; position:absolute; left:14px; bottom:-14px; border:10px solid transparent; border-top:12px solid var(--s); border-bottom:0; opacity:.8; z-index:2}
.path li:last-child::after, .path li.grp::after{display:none}
.path li.done::before{opacity:.9}
.path li.first{margin-bottom:22px}
.path li.first .stage{padding:20px 18px}
.path li.first .stage b{font-size:26px}
.path li.first .dot{width:56px; height:56px; font-size:26px; left:-4px; top:14px}
.path li.first::before{top:72px}
.intro{position:relative}
.intro-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0 10px}
.intro-top h1{margin:0}
.promo{background:var(--sheet); border:2px solid var(--burst); border-radius:var(--radius-sm); padding:10px 14px; margin:0 0 10px !important; font-size:16.5px !important; color:var(--ink) !important}
.burst{--burst:#D7263D; flex:none; width:112px; height:112px; display:grid; place-items:center;
  background:var(--burst); color:#fff; text-align:center; transform:rotate(-12deg);
  clip-path:polygon(50% 0%,59% 12%,73% 5%,76% 20%,91% 18%,87% 33%,100% 40%,90% 51%,100% 62%,86% 68%,90% 83%,75% 81%,71% 96%,58% 88%,50% 100%,42% 88%,29% 96%,25% 81%,10% 83%,14% 68%,0% 62%,10% 51%,0% 40%,13% 33%,9% 18%,24% 20%,27% 5%,41% 12%);
  animation:pulse 2.4s ease-in-out infinite}
.intro{--burst:#D7263D}
.burst span{font-family:var(--head); font-weight:800; font-size:16px; line-height:1.05; text-transform:uppercase; letter-spacing:.02em}
@keyframes pulse{0%,100%{transform:rotate(-12deg) scale(1)} 50%{transform:rotate(-8deg) scale(1.07)}}
.ex-btn{display:grid; grid-template-columns:40px 1fr auto; gap:12px; align-items:center; width:100%; text-align:left; font:inherit; color:var(--ink);
  background:var(--sheet); border:3px solid var(--s); border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 12px; cursor:pointer; box-shadow:4px 4px 0 var(--s);
  animation:nudge 2.6s ease-in-out infinite}
.ex-btn b{display:block; font-family:var(--head); font-size:17px; line-height:1.2}
.ex-btn small{display:block; font-weight:700; color:var(--s); font-size:14.5px}
.ex-ico{width:40px; height:40px; border-radius:50%; background:var(--s); color:var(--on-s); display:grid; place-items:center; font-family:var(--head); font-weight:800; font-size:22px}
.ex-go{font-size:22px; font-weight:800; color:var(--s)}
.ex-btn:hover{transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--s); animation:none}
@keyframes nudge{0%,80%,100%{transform:translateX(0)} 86%{transform:translateX(5px)} 92%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){ .burst,.ex-btn{animation:none} }
:root[data-still] .burst, :root[data-still] .ex-btn{animation:none}
@media (max-width:380px){ .burst{width:96px; height:96px} .burst span{font-size:14px}  }

/* ---- v5 : le piège ---- */
.alert-ico{flex:none; width:30px; height:28px; display:block; border:0; padding:0; margin:0; background:none}
.alert-ico.big{width:40px; height:37px}
.trap{position:relative; border:3px solid #D7263D; border-radius:var(--radius-sm); padding:12px 14px 14px; background:color-mix(in srgb,#D7263D 6%, var(--sheet))}
.trap-alert{display:flex; gap:10px; align-items:center; color:color-mix(in srgb,#D7263D 70%,var(--ink)); font-size:17px; line-height:1.25}
.trap-k{font-size:14.5px; color:var(--ink-soft); margin:8px 0 8px}
.tell{position:relative; display:grid; grid-template-columns:28px 1fr; column-gap:10px; border-radius:10px; padding:10px 12px; margin:0 0 8px; background:var(--sheet); border:2px solid var(--line)}
.tell p{margin:0; font-style:italic; font-size:15.5px; position:relative}
.tell small{grid-column:2; display:block; margin-top:4px; font-weight:700; font-size:14px}
.tell .mark{grid-row:span 2; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:#fff}
.tell.bad .mark{background:#D7263D} .tell.bad small{color:color-mix(in srgb,#D7263D 70%,var(--ink))}
.tell.good .mark{background:var(--ok)} .tell.good small{color:var(--ok)}
.tell.bad p{text-decoration:line-through; text-decoration-thickness:2.5px; text-decoration-color:#D7263D}
.replay{font:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); background:none; border:0; text-decoration:underline; cursor:pointer; padding:2px 0}
/* animation : la mauvaise version apparaît, tremble, est barrée ; puis la bonne arrive */
.trap.play .trap-alert .alert-ico{animation:blink 1s ease-in-out 3}
.trap.play .tell.bad{animation:pop .4s ease-out both, shake .5s .9s ease-in-out both}
.trap.play .tell.bad .mark, .trap.play .tell.bad small{animation:fadein .3s 1.4s both}
.trap.play .tell.bad p{animation:strike .5s 1.4s both, dim .4s 2s forwards}
.trap.play .tell.good{animation:slidein .5s 2.4s ease-out both}
.trap.play .tell.good .mark{animation:popmark .4s 2.9s both}
@keyframes pop{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}
@keyframes strike{from{text-decoration-color:transparent} to{text-decoration-color:#D7263D}}
@keyframes fadein{from{opacity:0} to{opacity:1}}
@keyframes dim{to{opacity:.5}}
@keyframes slidein{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes popmark{0%{transform:scale(0)} 70%{transform:scale(1.25)} 100%{transform:scale(1)}}
@keyframes blink{50%{transform:scale(1.2)}}
.ex-btn{border-color:#D7263D !important; box-shadow:4px 4px 0 #D7263D !important}
.ex-btn small, .ex-btn .ex-go{color:color-mix(in srgb,#D7263D 70%,var(--ink)) !important}
.angle-keep{display:flex; gap:10px; align-items:flex-start; border:2px solid #D7263D; border-radius:10px; padding:9px 12px; margin:0 0 14px; background:color-mix(in srgb,#D7263D 5%, var(--sheet)); font-size:15px}
.angle-keep b{display:block; color:color-mix(in srgb,#D7263D 70%,var(--ink)); font-size:15.5px}
@media (prefers-reduced-motion:reduce){ .trap.play *{animation:none !important} }
:root[data-still] .trap.play *{animation:none !important}

/* ---- v6 : aide pour trouver une mission ---- */
.coach-btn{display:grid; grid-template-columns:58px 1fr auto; gap:12px; align-items:center; width:100%; text-align:left; font:inherit; color:var(--ink);
  background:var(--sheet); border:3px solid #D7263D; border-radius:var(--radius-sm); padding:10px 14px; margin:0 0 16px; cursor:pointer; box-shadow:4px 4px 0 #D7263D}
.coach-btn b{display:block; font-family:var(--head); font-size:17px; line-height:1.2}
.coach-btn small{display:block; font-weight:700; color:color-mix(in srgb,#D7263D 70%,var(--ink)); font-size:14.5px}
.coach-btn .ex-go{color:color-mix(in srgb,#D7263D 70%,var(--ink))}
.coach-btn:hover{transform:translate(-1px,-1px); box-shadow:6px 6px 0 #D7263D}
.mini-burst{width:58px; height:58px; display:grid; place-items:center; background:#D7263D; color:#fff;
  clip-path:polygon(50% 0%,59% 12%,73% 5%,76% 20%,91% 18%,87% 33%,100% 40%,90% 51%,100% 62%,86% 68%,90% 83%,75% 81%,71% 96%,58% 88%,50% 100%,42% 88%,29% 96%,25% 81%,10% 83%,14% 68%,0% 62%,10% 51%,0% 40%,13% 33%,9% 18%,24% 20%,27% 5%,41% 12%);
  animation:pulse 2.4s ease-in-out infinite}
.mini-burst span{font-family:var(--head); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.02em}
.find{list-style:none; padding:0; margin:4px 0 0; display:grid; gap:10px; counter-reset:f}
.find > li{counter-increment:f; display:grid; grid-template-columns:30px 1fr; column-gap:10px; border-bottom:1.5px dashed var(--line); padding-bottom:10px}
.find > li::before{content:counter(f); grid-row:span 3; width:30px; height:30px; border-radius:50%; background:#D7263D; color:#fff; display:grid; place-items:center; font-weight:800}
.find b{font-family:var(--head); font-size:17px}
.find span{color:var(--ink-soft); font-size:15.5px}
.find ul{margin:4px 0 0; padding-left:18px; font-size:15.5px}
@media (prefers-reduced-motion:reduce){ .mini-burst{animation:none} }
:root[data-still] .mini-burst{animation:none}

/* ---- v7 : jargon pro, speech, chrono ---- */
.vocab{border:2px solid var(--s); border-radius:var(--radius-sm); padding:10px 12px; margin:0 0 12px; background:var(--sheet)}
.vocab-h{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 6px}
.vocab-h b{font-family:var(--head); font-size:16px}
.vocab-n{font-size:13px; font-weight:800; background:var(--s); color:var(--on-s); border-radius:999px; padding:1px 10px; white-space:nowrap}
.vocab-w{display:flex; flex-wrap:wrap; gap:6px}
.vocab-w button{font:inherit; font-size:14px; font-weight:700; color:var(--ink); background:var(--paper); border:1.5px dashed var(--s); border-radius:8px; padding:4px 10px; cursor:pointer}
.vocab-w button.on{background:var(--s); color:var(--on-s); border-style:solid}
.vocab small{display:block; margin-top:6px; color:var(--ink-soft); font-size:13px}
.pro{border-left:4px solid var(--ink); background:var(--paper); border-radius:0 8px 8px 0; padding:9px 12px; margin:0 0 12px}
.pro > b{display:block; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px}
.pro-row{display:grid; grid-template-columns:1fr auto 1.3fr; gap:8px; align-items:baseline; font-size:15px; padding:3px 0}
.pro-row::after{content:""; order:2}
.pro-row s{color:var(--ink-soft); text-decoration-color:#D7263D; text-decoration-thickness:2px}
.pro-row span{font-weight:700; grid-column:3}
.pro-row s{grid-column:1}
.pro-row::before{content:"→"; grid-column:2; grid-row:1; font-weight:800; color:var(--s)}
@media (max-width:420px){ .pro-row{grid-template-columns:1fr} .pro-row::before{display:none} .pro-row s,.pro-row span{grid-column:1} }
.speech .lead{font-style:italic; color:var(--ink-soft); font-size:15.5px}
.speech .q-if{font-weight:700; font-style:italic}
.speech .empty{color:var(--alert); font-style:italic}
.vocab-sum{margin:10px 0 0; padding-top:8px; border-top:1.5px dashed var(--line); font-size:14.5px; color:var(--ink-soft)}
.chrono{background:var(--sheet); border:3px solid var(--s); border-radius:var(--radius-sm); padding:14px; margin:0 0 12px; position:sticky; top:6px; z-index:3}
.ch-now{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.ch-now span{font-family:var(--head); font-weight:800; font-size:22px}
.ch-now b{font-family:var(--head); font-weight:800; font-size:34px; color:var(--s); font-variant-numeric:tabular-nums}
.ch-bar{display:flex; gap:3px; margin:8px 0 10px}
.ch-bar span{min-width:0; text-align:center; font-size:12.5px; font-weight:700; padding:6px 2px; border-radius:5px; background:var(--paper); color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch-bar span.on{background:var(--s); color:var(--on-s)}
.ch-bar span.done{background:color-mix(in srgb,var(--s) 35%, var(--paper)); color:var(--ink)}
.ch-btns{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:6px}
.ch-btns .btn{padding:9px 6px; font-size:15px; justify-content:center}
.ch-btns .btn.solid{background:var(--s); border-color:var(--s); color:var(--on-s)}
.selfcheck{background:var(--sheet); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin:0 0 12px; display:grid; gap:4px}
.selfcheck > b{font-family:var(--head); font-size:17px; margin-bottom:4px}
.selfcheck label{display:flex; gap:10px; align-items:flex-start; padding:6px 0; font-size:16px; cursor:pointer}
.selfcheck input{width:22px; height:22px; accent-color:var(--s); flex:none; margin:1px 0 0}
.co-ex-row{display:flex; gap:10px; align-items:center; font-weight:700}
.co-ex-row .pill{font-family:var(--head); font-weight:800; background:var(--c); color:var(--on-c); border-radius:7px; padding:2px 9px; flex:none}
.co-ex-eq{margin:2px 0 10px 50px; font-family:var(--head); font-weight:800; font-size:18px; color:var(--s)}
.co-ex-eq:last-child{margin-bottom:0}
.mini-damier{display:grid; gap:4px; margin:0 0 12px}
.md-row{display:flex; gap:4px; align-items:center}
.md-row i{font-style:normal; width:26px; height:26px; border-radius:6px; background:var(--c); color:var(--on-c); display:grid; place-items:center; font-weight:800; font-size:13px; flex:none}
.md-row span{flex:1; text-align:center; font-size:13px; font-weight:700; padding:4px 0; border-radius:6px; background:var(--sheet); border:1.5px solid var(--line); border-top:4px solid var(--c)}
.talk-pro{border:3px solid var(--s)}
.talk-pro .pro-row{background:var(--paper); border-radius:8px; padding:8px 10px; margin:6px 0 10px}
.talk-list{list-style:none; padding:0; margin:0 0 8px; display:flex; flex-wrap:wrap; gap:6px}
.talk-list li{background:var(--s); color:var(--on-s); font-weight:700; font-size:14.5px; border-radius:999px; padding:4px 12px}

.ex-tag{display:inline-block; vertical-align:2px; font-family:var(--body); font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:#D7263D; border-radius:4px; padding:2px 7px; margin:0 0 6px}
h4 .ex-tag, h2 .ex-tag{margin:0 0 0 6px}
.co-ex .ex-tag, .talk-pro > .ex-tag, .trap > .ex-tag{display:table}
.pro > .ex-tag{margin-left:6px}
.two small{display:block; font-size:13.5px; opacity:.9}
.profil{display:block; text-decoration:none; color:var(--ink-soft); background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:6px; margin:0 0 12px}
.profil img{display:block; width:100%; height:auto; border-radius:6px}
.profil span{display:block; text-align:center; font-size:13px; font-weight:700; margin-top:6px}

}

a3:{t:"Recevoir et exécuter des mandats propres au domaine commercial", easy:1,

 off:"Les employés de commerce vendent leur profil de compétence dans des situations de concurrence interne et externe pour des mandats propres au domaine commercial. Ils fournissent des services conformément aux mandats qui leur ont été confiés et vérifient la bonne exécution du mandat à la satisfaction du client. Les employés de commerce réfléchissent à leur réussite, analysent leurs actions et en déduisent des mesures d'amélioration."},

a5:{t:"Intégrer des questions politiques et une approche culturelle dans ses actions", easy:0,

b4:{t:"Exécuter des tâches de gestion de projets propres au domaine commercial et traiter des projets partiels", easy:1,

  soiree:["#FF4FA3","#3EE0F0","#B6F23A","#FFB020","#B590FF"],

};
const pal = PAL[document.documentElement.dataset.skin] || PAL.classique;
function onColor(hex){
  const h = String(hex).replace("#",""); if (h.length !== 6) return "#FFFFFF";
  const ch = i => { const c = parseInt(h.slice(i,i+2),16)/255; return c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  const L = .2126*ch(0) + .7152*ch(2) + .0722*ch(4);
  return L > .36 ? "#12152B" : "#FFFFFF";
}
const colorOf = code => pal["ABCDE".indexOf(code[0].toUpperCase())] || pal[0];

};

const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'");
const stem = w => { const n = norm(w); return n.length > 6 ? n.slice(0, n.length - 2) : n; };

  const k = S.sel[i]; if (!k || !VOCAB[k]) return [];
  const all = norm(FIELDS.map(f => S.prep[i][f] || "").join(" "));
  return VOCAB[k].filter(w => all.includes(stem(w)));
}

        <div class="ch-now"><span id="chPh">Prêt·e ?</span><b id="chT">5:00</b></div>
        <div class="ch-bar">${PH.map((x,j) => `<span style="flex:${x[1]}" data-j="${j}">${x[0]}</span>`).join("")}</div>
        <div class="ch-btns"><button class="btn solid" id="chGo">Démarrer</button><button class="btn" id="chNext">Suivante</button><button class="btn" id="chReset">À zéro</button></div>
      </div>
      ${speechCard(ci, true)}
      <div class="selfcheck"><b>Je vérifie</b>
        ${SELF.map(([id,t]) => `<label><input type="checkbox" data-ck="${id}" ${ck[id]?"checked":""}><span>${t}</span></label>`).join("")}
      </div>`;
  }
  else if (kind === "done"){
    h += `<div class="done-box"><b>Compétence ${ci+1} prête</b></div>` + speechCard(ci) +
      `<div class="actions-col">${ci===0 ? `<button class="btn solid" data-go="co2">Passer à ma compétence 2 &rarr;</button>` : `<button class="btn solid" data-go="speech">Voir mon speech complet</button>`}
       <button class="btn" data-go="home">Retour à mes 3 étapes</button></div>`;
  }

  if (kind !== "done"){
    const canNext = kind === "pick" ? !!k : true;
    h += `<div class="nav">${st>0?`<button class="btn" id="bPrev" aria-label="Précédent">&larr;</button>`:""}
      ${canNext ? `<button class="btn solid" id="bNext">${kind==="say"?"Terminer":kind==="pick"?`Continuer avec ${k}`:"Suivant"} &rarr;</button>` : ""}</div>`;
  }
  $("s-co").innerHTML = h;

  /* liaisons */
  $("s-co").querySelectorAll("[data-entry]").forEach(b => b.onclick = () => {
    S.entry[ci] = b.dataset.entry; S.step[ci] = 1; save(); renderCo(); window.scrollTo(0,0);
  });
  $("s-co").querySelectorAll("textarea").forEach(t => {
    if (t.dataset.f === "task" && p.task == null && has(t.value)) p.task = t.value;
    t.addEventListener("input", () => { p[t.dataset.f] = t.value; setSave("Enregistrement…"); clearTimeout(saveT); saveT = setTimeout(save, 400); });
  });
  $("s-co").querySelectorAll("[data-start]").forEach(b => b.onclick = () => {
    const t = $("f-"+b.dataset.start); const sep = t.value && !/\s$/.test(t.value) ? " " : "";
    t.value += sep + b.textContent + " "; t.dispatchEvent(new Event("input")); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  });
  $("s-co").querySelectorAll("[name=ifq]").forEach(r => r.onchange = () => { p.altQ = r.value; save(); });
  $("s-co").querySelectorAll("textarea").forEach(t => t.addEventListener("focus", () => { lastTA = t; }));
  $("s-co").querySelectorAll("[data-word]").forEach(b => b.onclick = () => {
    const t = lastTA && lastTA.isConnected ? lastTA : $("s-co").querySelector("textarea"); if (!t) return;
    const w = b.dataset.word, sep = t.value && !/\s$/.test(t.value) ? " " : "";
    t.value += sep + w + " "; t.dispatchEvent(new Event("input")); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  });
  $("s-co").querySelectorAll("textarea").forEach(t => t.addEventListener("input", () => refreshVocab(ci)));
  $("s-co").querySelectorAll("[data-ck]").forEach(c => c.onchange = () => { p.check = p.check || {}; p.check[c.dataset.ck] = c.checked; save(); });
  if (kind === "say") initChrono();
  $("s-co").querySelectorAll("[data-co]").forEach(b => b.onclick = () => openSheet(b.dataset.co));
  if ($("exBtn")) $("exBtn").onclick = openExample;
  if ($("coachBtn")) $("coachBtn").onclick = openFind;
  const move = d => { clearTimeout(saveT); stopChrono(); S.step[ci] = Math.max(0, Math.min(seq.length-1, st + d)); save(); renderCo(); window.scrollTo(0,0); };
  if ($("bPrev")) $("bPrev").onclick = () => move(-1);
  if ($("bNext")) $("bNext").onclick = () => { if (kind === "pick" && !S.sel[ci]) return; move(1); };
}
let lastTA = null;
function vocabBox(i){
  const k = S.sel[i]; if (!k || !VOCAB[k]) return "";
  const used = vocabUsed(i);
  return `<div class="vocab" id="vocab"><div class="vocab-h"><b>Les mots du métier · ${k}</b><span class="vocab-n" id="vocabN">${used.length} utilisé${used.length>1?"s":""}</span></div>
    <div class="vocab-w">${VOCAB[k].map(w => `<button type="button" data-word="${esc(w)}" class="${used.includes(w)?"on":""}">${esc(w)}</button>`).join("")}</div>
    <small>Touchez un mot pour l'ajouter dans la case où vous écrivez.</small></div>`;
}
function refreshVocab(i){
  const box = $("vocab"); if (!box) return;
  const used = vocabUsed(i);
  $("vocabN").textContent = `${used.length} utilisé${used.length>1?"s":""}`;
  box.querySelectorAll("[data-word]").forEach(b => b.classList.toggle("on", used.includes(b.dataset.word)));
}
const PH = [["Pourquoi",60],["Situation",60],["Analyse",120],["Et si…",60]];
const SELF = [["noread","Je l'ai dit sans lire"],["je","J'ai dit « j'ai fait », pas « on a fait »"],["vocab","J'ai utilisé les mots du métier"],["time","J'ai tenu à peu près 5 minutes"]];
let chI = null, chPhase = 0, chLeft = 60, chRun = false;
function chShow(){
  const ph = $("chPh"); if (!ph) return;
  const done = chPhase >= PH.length;
  ph.textContent = done ? "Terminé. Bravo !" : (chRun || chPhase > 0 || chLeft < PH[0][1] ? PH[chPhase][0] : "Prêt·e ?");
  let tot = done ? 0 : chLeft; for (let j = chPhase + 1; j < PH.length; j++) tot += PH[j][1];
  $("chT").textContent = `${Math.floor(tot/60)}:${String(tot%60).padStart(2,"0")}`;
  document.querySelectorAll(".ch-bar span").forEach((el,j) => el.className = j < chPhase ? "done" : j === chPhase && (chRun || chLeft < PH[0][1] || chPhase > 0) ? "on" : "");
}
function stopChrono(){ clearInterval(chI); chRun = false; }
function initChrono(){
  stopChrono(); chPhase = 0; chLeft = PH[0][1]; chShow();
  $("chGo").onclick = () => {
    if (chPhase >= PH.length){ chPhase = 0; chLeft = PH[0][1]; }
    chRun = !chRun; $("chGo").textContent = chRun ? "Pause" : "Reprendre"; clearInterval(chI);
    if (chRun) chI = setInterval(() => {
      chLeft--; if (chLeft <= 0){ chPhase++; chLeft = chPhase < PH.length ? PH[chPhase][1] : 0; }
      if (chPhase >= PH.length){ stopChrono(); $("chGo").textContent = "Recommencer"; }
      chShow();
    }, 1000);
    chShow();
  };
  $("chNext").onclick = () => { if (chPhase >= PH.length) return; chPhase++; chLeft = chPhase < PH.length ? PH[chPhase][1] : 0; if (chPhase >= PH.length){ stopChrono(); $("chGo").textContent = "Recommencer"; } chShow(); };
  $("chReset").onclick = () => { stopChrono(); chPhase = 0; chLeft = PH[0][1]; $("chGo").textContent = "Démarrer"; chShow(); };
}
function headTitle(kind){
  return {pick:"Sous quel angle ?", mission:"Votre mission", say:"Je le dis", done:"Bravo"}[kind] || Q[kind].h;
}

/* Damier des compétences */
function damier(){
  const other = S.sel[1-ci];
  return "ABCDE".split("").map(L => {
    const codes = Object.keys(CO).filter(k => k[0] === L.toLowerCase());
    const offs = Object.keys(OFF).filter(k => k[0] === L.toLowerCase());
    const dl = konv(L);
    return `<div class="dco" style="${cvars(L)}"><h3><i>${L}</i>${esc(DCO[L])}${dl?`<a href="${esc(dl)}" target="_blank" rel="noopener">Guide</a>`:""}</h3>
      <div class="tiles">${codes.map(k => {
        const mine = S.sel[ci] === k, taken = other === k;
        return `<button class="tile${mine?" sel":""}${taken?" taken":""}" data-co="${k}"><b>${k}</b><span>${esc(CO[k].t)}</span>${mine?"<em>Mon choix</em>":taken?`<em>Déjà choisie (compétence ${2-ci})</em>`:""}</button>`;
      }).join("")}${offs.map(k => `<div class="tile off"><b>${k}</b><span>${esc(OFF[k])}</span><em>Option, non sélectionnable</em></div>`).join("")}</div></div>`;
  }).join("");
}
function openSheet(k){
  const c = CO[k], d = $("sheet"), link = konv(k);
  const mine = S.sel[ci] === k, taken = S.sel[1-ci] === k;
  d.setAttribute("style", cvars(k));
  d.innerHTML = `<div class="sheet-head"><button class="x" id="shX" autofocus>Fermer</button><div class="code">${k}</div><h3>${esc(c.t)}</h3></div>
   <div class="sheet-body">
    <h4>L'angle à prendre</h4><p>${esc(c.angle)}</p>
    <h4>Des idées à l'Espace Entreprise <span class="ex-tag">Exemple</span></h4>
    <ul>${c.ex.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="sheet-acts">
      ${taken ? `<button class="btn" disabled>Déjà choisie pour la compétence ${2-ci}</button>`
        : mine ? `<button class="btn solid" id="shKeep">Garder ${k} &rarr;</button>`
        : `<button class="btn solid" id="shAdd">Je choisis ${k} &rarr;</button>`}
      ${link ? `<a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Lire la théorie (Guide pratique)</a>` : ""}
    </div>
   </div>`;
  const close = () => { d.close(); };
  $("shX").onclick = close;
  d.onclick = e => { if (e.target === d) close(); };
  const pick = () => { S.sel[ci] = k; S.step[ci] = seqOf(ci).indexOf("pick") + 1; save(); close(); renderCo(); window.scrollTo(0,0); };
  if ($("shAdd")) $("shAdd").onclick = pick;
  if ($("shKeep")) $("shKeep").onclick = pick;
  if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open","");
  d.scrollTop = 0;
}

/* =====================================================================
   MON SPEECH (relecture, PDF)
   ===================================================================== */
function speechCard(i, compact){
  const k = S.sel[i], p = S.prep[i];
  if (!k) return `<div class="speech"><h2>Compétence ${i+1}</h2><p class="empty" style="color:var(--alert);font-style:italic;margin:0">Pas encore choisie.</p></div>`;
  const cap = v => { v = v.trim(); return v.charAt(0).toUpperCase() + v.slice(1); };
  const own = v => has(v) ? `<p>${esc(cap(v))}</p>` : `<p class="empty">…à compléter</p>`;
  const link = t => `<p class="lead">${esc(t)}</p>`;
  const title = CO[k].t.charAt(0).toLowerCase() + CO[k].t.slice(1);
  const q = p.altQ != null && p.altQ !== "" ? IFS[+p.altQ] : "";
  const used = vocabUsed(i);
  return `<div class="speech" style="${cvars(k)}"><h2><i>${k}</i>${esc(CO[k].t)}</h2>
    <div class="sp"><h3>Pourquoi · 1 min</h3>
      ${link(i === 0 ? `Bonjour. J'ai choisi de vous présenter la compétence ${k} : ${title}.` : `Ma deuxième compétence est la compétence ${k} : ${title}.`)}
      ${own(p.like)}${own(p.strong)}</div>
    <div class="sp"><h3>Situation · 1 min</h3>
      ${link("Je vais vous présenter une situation concrète que j'ai vécue.")}
      ${own(p.where)}${own(p.mission || p.task)}${own(p.chal)}${own(p.did)}${own(p.res)}</div>
    <div class="sp"><h3>Analyse · 2 min</h3>
      ${link("Avec le recul, voici mon analyse.")}
      ${own(p.work)}${own(p.next)}</div>
    <div class="sp"><h3>Et si… · 1 min</h3>
      ${q ? `<p class="q-if">Question possible : ${esc(q)}</p>` : ""}
      ${own(p.altA)}
      ${link(i === 0 ? "Je passe maintenant à ma deuxième compétence." : "Je vous remercie de votre attention.")}</div>
    ${compact ? "" : `<p class="vocab-sum">Mots du métier utilisés : <b>${used.length}</b>${used.length ? ` · ${used.map(esc).join(", ")}` : ""}</p>`}
  </div>`;
}
function renderSpeech(){
  backHome();
  $("s-speech").innerHTML = `<div class="head"><div class="k">Mon TP5</div><h1>Mon speech</h1></div>
    <div class="actions-col no-print" style="margin:0 0 14px"><button class="btn solid" id="bPdf">Enregistrer en PDF</button></div>
    ${speechCard(0)}${speechCard(1)}
    <div class="actions-col no-print"><button class="btn" data-go="home">Retour à mes 3 étapes</button></div>`;
  $("bPdf").onclick = () => window.print();
}

route();
</script>
</body>
</html>
